<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>码传 · 电脑接收端</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f7; color: #222; }
  .app { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; color: #1E88E5; }
  .panel, .display { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 2px 14px rgba(0,0,0,.06); margin-bottom: 16px; }
  label { font-size: 13px; color: #666; display: block; margin: 10px 0 5px; }
  input { width: 100%; padding: 11px; border: 1px solid #d0d7de; border-radius: 9px; font-size: 14px; outline: none; }
  input:focus { border-color: #1E88E5; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row input { flex: 1; }
  button { padding: 11px 18px; border: none; border-radius: 9px; background: #1E88E5; color: #fff; font-size: 14px; cursor: pointer; white-space: nowrap; transition: .15s; }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.98); }
  button.secondary { background: #607d8b; }
  #status { margin-top: 14px; font-size: 14px; color: #555; display: flex; align-items: center; }
  #members { margin-top: 8px; font-size: 14px; color: #1E88E5; font-weight: bold; min-height: 18px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: #bbb; flex: none; }
  .dot.ok { background: #4CAF50; }
  .dot.warn { background: #FFA000; }
  .dot.err { background: #e53935; }
  .display { text-align: center; min-height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #qrcode { display: inline-block; padding: 12px; background: #fff; }
  #qrcode img, #qrcode canvas { width: 300px !important; height: 300px !important; }
  #content { margin-top: 16px; font-size: 16px; word-break: break-all; color: #111; min-height: 22px; max-width: 100%; }
  #meta { margin-top: 8px; font-size: 12px; color: #999; }
  .actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
  .hint { font-size: 12px; color: #9aa4af; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <h1>码传 · 电脑接收端</h1>

  <div class="panel">
    <label>Broker 地址（MQTT over WebSocket）</label>
    <input id="broker" value="ws://broker.emqx.io:8083/mqtt">
    <label>房间号（发送端显示的 6 位号）</label>
    <div class="row">
      <input id="room" placeholder="输入发送端的 6 位房间号" maxlength="6" inputmode="numeric">
      <button id="btnJoin">加入</button>
    </div>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></div>
    <div id="members"></div>
    <div class="hint">手机端选「发送二维码」创建房间后，把房间号输到这里点「加入」。</div>
  </div>

  <div class="display">
    <div id="qrcode"></div>
    <div id="content">等待接收…</div>
    <div id="meta"></div>
    <div class="actions">
      <button id="btnCopy">复制内容</button>
      <button id="btnOpen" class="secondary">打开链接</button>
    </div>
  </div>
</div>

<script>
